services:
  postgres:
    image: postgres:18-alpine
    container_name: balitrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-balitrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-balitrade}
      POSTGRES_DB: ${POSTGRES_DB:-balitrade}
    ports:
      # Bound to localhost only — the database is not exposed to the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images store data under /var/lib/postgresql/<version>/
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
