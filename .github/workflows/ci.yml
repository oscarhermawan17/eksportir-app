#  CI automatic, CD manual (decided 2026-10-31). This workflow checks every push and, on main, builds and
#  pushes the two images to GHCR. Deploying is done by hand over SSH: see docs/DEPLOY.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: balitrade
          POSTGRES_PASSWORD: balitrade
          POSTGRES_DB: balitrade
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U balitrade"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://balitrade:balitrade@localhost:5432/balitrade
      # Test values only. Presigned R2 URLs are computed offline, so the tests never reach Cloudflare.
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      WEB_ORIGIN: http://localhost:3000
      R2_ACCOUNT_ID: ci
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      R2_PUBLIC_BUCKET: ci-public
      R2_PUBLIC_BASE_URL: https://example.invalid
      R2_PRIVATE_BUCKET: ci-private
      ADMIN_EMAIL: admin@balitrade.local
      ADMIN_PASSWORD: ci-only-password-123
      ADMIN_NAME: BaliTrade Admin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Message files have the same keys in all three languages
        run: python3 scripts/check-messages.py

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Prepare the database for the e2e tests
        run: pnpm --filter @balitrade/api db:deploy && pnpm db:seed

      - run: pnpm --filter @balitrade/api test:e2e

  images:
    name: Build and push images
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: The web image bakes in the API address, so it must be set
        if: matrix.name == 'web' && vars.NEXT_PUBLIC_API_URL == ''
        run: |
          echo "::error::Set the repository variable NEXT_PUBLIC_API_URL (Settings → Secrets and variables → Actions → Variables)."
          echo "Without it the built image would point at localhost and could never reach the API."
          exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/balitrade-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          # The repo root: both images need the lockfile, the workspace file and packages/shared.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
