# BaliTrade (testing environment). One certificate covers all three names.
# Upstreams are container names on the shared "edge" network; the Docker DNS resolver lets nginx start
# even when a container is temporarily down, instead of refusing to load the whole configuration.

# Plain HTTP and www both end up on the canonical HTTPS address.
server {
    listen 80;
    listen [::]:80;
    server_name projectbali.my.id www.projectbali.my.id api.projectbali.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.projectbali.my.id;

    ssl_certificate     /etc/letsencrypt/live/projectbali.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectbali.my.id/privkey.pem;

    return 301 https://projectbali.my.id$request_uri;
}

# ── the shop ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name projectbali.my.id;

    ssl_certificate     /etc/letsencrypt/live/projectbali.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectbali.my.id/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    client_max_body_size 60m;

    location / {
        set $upstream_web http://balitrade-web:3000;
        proxy_pass $upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── the API ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.projectbali.my.id;

    ssl_certificate     /etc/letsencrypt/live/projectbali.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectbali.my.id/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    # Payment proofs and QC files are uploaded straight to R2, but order notes and chat still post here.
    client_max_body_size 60m;

    location / {
        set $upstream_api http://balitrade-api:4000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO (order and product chat) needs the connection upgraded, and a long read timeout
        # so an idle websocket is not cut every 60 seconds.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
