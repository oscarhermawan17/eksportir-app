# BaliTrade on the VPS. A copy of this lives at /home/ubuntu/balitrade/docker-compose.yml; keep them in step.
#
# What is NOT here, on purpose:
#   - PostgreSQL: installed natively on the host (ARCHITECTURE §8), so no `compose down -v` can take the data.
#   - nginx: shared by every project on the box and defined in /home/ubuntu/infra, so bringing this stack
#     down never takes the other sites offline. It terminates HTTPS and forwards here by container name.
#   - published ports: nginx reaches these containers over the shared network, so nothing faces the internet.
#
# Deploy (manual — CI builds, you deploy):
#   docker compose pull && docker compose up -d
#
# The shared network is created once, by hand:  docker network create edge

name: balitrade

services:
  api:
    image: ghcr.io/oscarhermawan17/balitrade-api:${IMAGE_TAG:-latest}
    container_name: balitrade-api
    restart: unless-stopped
    env_file: .env
    expose:
      - '4000'
    networks:
      - edge

  web:
    image: ghcr.io/oscarhermawan17/balitrade-web:${IMAGE_TAG:-latest}
    container_name: balitrade-web
    restart: unless-stopped
    # NEXT_PUBLIC_API_URL is baked into the image at build time, not read here.
    environment:
      NODE_ENV: production
    expose:
      - '3000'
    depends_on:
      - api
    networks:
      - edge

networks:
  edge:
    external: true
