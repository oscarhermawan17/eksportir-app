packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - dotenv@18.0.9
  - '@aws-sdk/client-s3@3.1156.0'
  - '@aws-sdk/s3-request-presigner@3.1156.0'
